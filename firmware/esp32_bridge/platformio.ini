; Прошивка ESP32-S3: гироскутер + лидар + MPU6050 ↔ ROS 2.
; Две прошивки из одного кода, отличаются только каналом связи с ПК:
;   pio run -e wifi -t upload    — Wi-Fi, UDP (ПК с ROS отдельно от робота)
;   pio run -e usb  -t upload    — USB-кабель в порт «USB» платы (ПК на роботе),
;                                  на ПК появится /dev/ttyACM0
; Пины, геометрия и тайминги — в include/config.h,
; имя и пароль Wi-Fi — в include/secrets.h (создать из secrets.example.h).

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^1.4.1
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    ; Serial = встроенный USB ESP32-S3 (USB-Serial/JTAG)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:wifi]
build_flags =
    ${env.build_flags}
    -DTRANSPORT_WIFI

[env:usb]
build_flags =
    ${env.build_flags}
    -DTRANSPORT_USB
